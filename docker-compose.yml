services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campushub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CampusHubDev123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        server_pid=$$!
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null; do
          sleep 2
        done
        if ! /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SET NOCOUNT ON; SELECT DB_ID('CampusHub')" -h -1 -W | grep -q '[0-9]'; then
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /scripts/CampusHub_CreateDatabase.sql -b
        fi
        wait $$server_pid
    volumes:
      - campushub-sqlserver-data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CampusHubDev123!" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  campushub-sqlserver-data:
